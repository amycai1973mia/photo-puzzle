<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#E8590C"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>家庭照片拼图</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;background:#FFF8EC;color:#1E1E1E;font-size:clamp(19px,2.8vmin,28px);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.screen{display:none;min-height:100%;padding:12px 16px 76px;flex-direction:column;align-items:center}
.screen.on{display:flex}
h1{font-size:1.6em;margin:8px 0 4px;text-align:center}h2{font-size:1.2em;margin:0;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{color:#444;margin:4px 0 12px;text-align:center}
.btn{min-height:68px;padding:10px 20px;border:4px solid #1E1E1E;border-radius:20px;background:#fff;font:inherit;font-weight:700;color:#1E1E1E;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;margin:7px;line-height:1.2}
.btn.primary{background:#E8590C;color:#fff;border-color:#9C3A08}
.btn.sel{background:#1971C2;color:#fff;border-color:#0B4F8F}
.btn.small{min-height:56px;min-width:56px;padding:6px 14px;margin:0}
.btn .ic{font-size:1.4em}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.wide{width:min(92vw,460px)}
.top{width:100%;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.prefs{display:flex;gap:10px;justify-content:center;margin:6px 0}
#myList{width:min(94vw,720px);display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:8px}
.card{background:#fff;border:4px solid #1E1E1E;border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.card img{width:100%;aspect-ratio:1;border-radius:10px;cursor:pointer}
.card .meta{font-size:.8em;text-align:center}
.card .del{position:absolute;top:-14px;right:-14px;width:48px;height:48px;border-radius:50%;border:3px solid #1E1E1E;background:#fff;font-size:22px}
.card .badge{position:absolute;top:14px;left:14px;background:#2B8A3E;color:#fff;border-radius:12px;padding:2px 10px;font-size:.75em}
.samples{display:grid;grid-template-columns:repeat(3,min(27vw,180px));gap:14px;margin:6px 0}
.samples canvas{width:100%;aspect-ratio:1;border-radius:18px;border:5px solid #1E1E1E;cursor:pointer}
#cropBox{width:min(92vw,calc(100vh - 360px),calc(100dvh - 360px),520px);aspect-ratio:1;border:5px solid #1E1E1E;border-radius:12px;overflow:hidden;position:relative;background:#333;touch-action:none}
#cropCv{width:100%;height:100%;display:block}
input[type=range]{width:min(70vw,380px);height:52px;accent-color:#E8590C}
input[type=text]{font:inherit;padding:6px 12px;border:4px solid #1E1E1E;border-radius:16px;width:min(88vw,420px);min-height:56px}
#s-crop{padding-bottom:10px}#s-crop .row{margin:4px 0}#s-crop .btn{margin:3px}
.warn{background:#FFF3BF;border:3px solid #E67700;border-radius:16px;padding:8px 16px;margin:6px;display:none;max-width:560px;text-align:center}
.warn.err{background:#FFE3E3;border-color:#C92A2A}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:4000;align-items:center;justify-content:center}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:24px;padding:22px;max-width:min(92vw,620px);max-height:90vh;overflow:auto}
/* 拼图页 */
#s-play{padding:6px 6px 6px;height:100%;min-height:0}
#s-play .top{margin:0 0 6px}
#boardWrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#board{position:relative;background:#ddd;border-radius:6px;box-shadow:0 0 0 3px #1E1E1E;touch-action:none;overflow:visible}
.pc{position:absolute;left:0;top:0;background-repeat:no-repeat;transition:transform .28s ease;touch-action:none;outline:1px solid rgba(255,255,255,.7);outline-offset:-1px}
.pc.drag{transition:none;z-index:50;box-shadow:0 10px 26px rgba(0,0,0,.5);outline:3px solid #fff}
.pc.selp{outline:6px solid #1971C2;outline-offset:-6px;z-index:20}
.pc.ok{outline:none}
.pc.ok::after{content:"✓";position:absolute;right:4%;top:4%;width:max(22px,22%);height:max(22px,22%);border-radius:50%;background:rgba(43,138,62,.88);color:#fff;font-weight:900;font-size:max(14px,calc(var(--cell)*.15));display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.peek{position:absolute;inset:0;z-index:60;background-size:100% 100%;opacity:0;transition:opacity .35s;pointer-events:none;border-radius:6px}
.peek.on{opacity:1;pointer-events:auto}
.ptl{position:absolute;pointer-events:none;z-index:40;font-size:var(--fs);animation:drift 1.4s ease-out forwards}
@keyframes drift{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:0}20%{opacity:.95}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rt)) scale(1);opacity:0}}
#thumb{width:56px;height:56px;border-radius:12px;border:3px solid #1E1E1E;background-size:cover;flex:none;touch-action:none;cursor:zoom-in}
#bigThumb{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:3500;pointer-events:none}
#bigThumb.on{display:flex}
#bigThumb img{width:min(88vw,80vh);border-radius:14px;border:5px solid #fff}
.diff{flex-direction:column;min-width:min(27vw,170px);min-height:96px}
.diff small{font-weight:400;font-size:.7em;opacity:.85}
.more .btn{min-height:56px;font-size:.85em}
.cropCtl{display:flex;flex-direction:column;align-items:center}
@media (orientation:landscape) and (max-height:600px){
 #s-crop.on{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;gap:4px 14px;align-items:start;padding:6px 12px}
 #s-crop .top{grid-column:1/3;margin:0}
 #s-crop #cropBox{width:calc(100vh - 86px);width:calc(100dvh - 86px)}
 #s-crop .cropCtl{justify-content:center;height:100%}
 #s-crop .wide{width:100%}
 #s-play{flex-direction:row;padding:6px;align-items:stretch}
 #s-play .top{flex-direction:column;width:auto;height:100%;margin:0 6px 0 0;justify-content:space-between}
 #s-play .top h2{flex:none;font-size:.8em;white-space:normal;text-align:center;max-width:70px}
 #celebrate .row{flex-direction:column}
}
#celebrate{position:fixed;inset:0;display:none;z-index:2000;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18px;pointer-events:none}
#celebrate .row,#celebrate h1{pointer-events:auto}
#bouquetWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity 1s}
#bouquetWrap.fade{opacity:0}
#celebrate.on{display:flex}
#bouquet{font-size:min(30vw,30vh);animation:grow 1.2s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
@keyframes grow{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1)}}
.petal{position:fixed;top:-10vh;pointer-events:none;z-index:2001;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}
#celebrate h1{font-size:1.2em;margin:4px;background:#fff;border-radius:20px;padding:6px 22px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){.flower,#bouquet,.petal,.pc.hintp{animation-duration:.01s}}
#voice{pointer-events:none;position:fixed;bottom:8px;left:12px;right:12px;margin:auto;width:fit-content;max-width:92%;background:#1E1E1E;color:#fff;padding:9px 20px;border-radius:40px;z-index:5000;font-size:.9em;text-align:center;transition:opacity .5s}
#voice.hide{opacity:0}
</style></head><body>
<div id="voice"></div>

<section class="screen on" id="s-home">
  <div class="prefs"><button class="btn small" id="langBtn">🌐 English</button><button class="btn small" id="musicBtn">🎵</button><button class="btn small" id="voiceBtn">🔊</button></div>
  <h1 data-t="title"></h1>
  <button class="btn primary wide" id="newBtn"><span class="ic">➕</span><span data-t="newPuzzle"></span></button>
  <h2 style="flex:none;margin-top:14px" data-t="myPuzzles"></h2>
  <p class="tip" id="emptyTip" data-t="empty"></p>
  <div id="myList"></div>
</section>

<section class="screen" id="s-source">
  <div class="top"><button class="btn small" data-back="s-home">◀</button><h2 data-t="pickPhoto"></h2><span style="width:56px"></span></div>
  <p class="tip" data-t="pickTip"></p>
  <div class="samples" id="samples"></div>
  <div class="row">
    <label class="btn"><span class="ic">🖼️</span><span data-t="album"></span><input id="fileAlbum" type="file" accept="image/*" hidden></label>
    <label class="btn"><span class="ic">📷</span><span data-t="camera"></span><input id="fileCam" type="file" accept="image/*" capture="environment" hidden></label>
  </div>
  <div class="warn err" id="loadErr" data-t="badFile"></div>
  <button class="btn small" id="helpBtn" data-t="cantPick"></button>
</section>

<section class="screen" id="s-crop">
  <div class="top"><button class="btn small" data-back="s-source">◀</button><h2 data-t="adjustTip" style="font-size:.85em;white-space:normal"></h2><span style="width:56px"></span></div>
  <div id="cropBox"><canvas id="cropCv" width="600" height="600"></canvas></div>
  <div class="cropCtl">
  <div class="warn" id="qualWarn" style="margin:4px;padding:4px 12px;font-size:.8em"></div>
  <div class="row"><button class="btn small" id="zoomOut" aria-label="zoom out">➖</button><button class="btn small" id="zoomIn" aria-label="zoom in">➕</button>
    <span style="width:10px"></span><span aria-hidden="true">🔤</span>
    <button class="btn small sz" data-s="S" data-t="sS"></button><button class="btn small sz sel" data-s="M" data-t="sM"></button><button class="btn small sz" data-s="L" data-t="sL"></button></div>
  <div class="row"><input type="text" id="labelTxt" maxlength="20"></div>
  <button class="btn primary wide" id="toPieces"><span class="ic">✔</span><span data-t="useThis"></span></button>
  </div>
</section>

<section class="screen" id="s-pieces">
  <div class="top"><button class="btn small" data-back="s-crop">◀</button><h2 data-t="howMany"></h2><span style="width:56px"></span></div>
  <canvas id="previewCv" width="300" height="300" style="width:min(56vw,34vh,300px);border:5px solid #1E1E1E;border-radius:16px;margin:6px"></canvas>
  <div class="row" id="pieceChoices"></div>
  <button class="btn primary wide" id="startPlay"><span class="ic">▶</span><span data-t="start"></span></button>
</section>

<section class="screen" id="s-play">
  <div class="top"><button class="btn small" id="playBack">◀</button><h2 id="progress"></h2><button class="btn small" id="musicBtn2">🎵</button><button class="btn small" id="hintBtn">💡</button><div id="thumb" role="img" aria-label="original"></div></div>
  <div id="boardWrap"><div id="board"></div></div>
</section>

<div id="celebrate"><div id="bouquetWrap"><div id="bouquet">💐</div></div><h1 data-t="done"></h1>
  <div class="row"><button class="btn primary" id="saveImg" data-t="saveImg"></button><button class="btn" id="again" data-t="again"></button><button class="btn" id="homeBtn" data-t="home"></button></div></div>
<div id="bigThumb"><img id="bigThumbImg" alt=""></div>

<div class="modal" id="helpBox"><div class="box"><h2 style="text-align:left;white-space:normal" data-t="helpTitle"></h2><div data-th="helpBody"></div><button class="btn primary" id="helpClose" data-t="ok"></button></div></div>
<div class="modal" id="delBox"><div class="box"><h2 style="white-space:normal" data-t="delQ"></h2><div class="row"><button class="btn" id="delNo" data-t="no"></button><button class="btn primary" id="delYes" data-t="yesDel"></button></div></div></div>

<script>
const $=id=>document.getElementById(id);
// ================= 文本（中文 / English）=================
const TXT={zh:{title:'🧩 家庭照片拼图',newPuzzle:'做一个新拼图',myPuzzles:'我的拼图',empty:'还没有拼图，点上面的橙色按钮做一个吧',pickPhoto:'选一张照片',pickTip:'点一张示例图，或者用自己的照片',album:'从相册选',camera:'拍一张',badFile:'这张照片打不开，请换一张试试。',cantPick:'❓ 选不了照片？',adjust:'调整照片',adjustTip:'单指拖动、双指缩放，选好要拼的部分',saveImg:'💾 保存图片',easy:'简单',normal:'普通',hard:'挑战',more:'更难：',size:'文字大小：',sS:'小',sM:'中',sL:'大',useThis:'就用这张',howMany:'要拼几块？',start:'开始拼图',done:'太棒了！拼好啦！',again:'🔁 再拼一次',home:'🏠 回首页',ok:'好的，我知道了',delQ:'要删除这个拼图吗？',no:'不删',yesDel:'删除',continue:'继续',replay:'再玩',finished:'已完成',pieces:'块',
 helpTitle:'选不了照片怎么办？',helpBody:'<p>可以先用示例图。想用自己的照片，请家人帮忙：</p><ul><li><b>iPhone / iPad：</b>设置 → Safari → 相机 / 照片 → 允许</li><li><b>安卓：</b>设置 → 应用 → 浏览器 → 权限 → 打开相机和照片</li><li>在微信里打开的话，点右上角“…”，选“在浏览器中打开”。</li></ul><p>照片只保存在这台设备上，不会上传。</p>',
 labelDefault:d=>`${d.getFullYear()}年${d.getMonth()+1}月制作`,prog:(a,b)=>`已拼好 ${a} / ${b}`,
 v:{hello:'你好！我们一起来拼照片吧。',pick:'请选一张照片。',adjust:'拖动照片，选好要拼的部分。还可以在照片上写几个字。',small:'这张照片有点小，可能不够清楚。可以继续，也可以换一张。',blurry:'这张照片看起来有点模糊。可以继续，也可以换一张。',bad:'这张照片打不开，请换一张试试。',how:'要拼几块？我们先帮你选了九块。',start:'拖动一块到它该去的地方，它会和那里的一块换位置。',resume:'接着上次的拼吧。',good:['真棒！','放对了！','好厉害！','又一朵小花！'],hint:'看，黄色这块应该放到虚线框里。',done:'太棒了！拼好啦！送你一大束花！',saved:'已经保存了，下次可以接着拼。',help:'可以先用示例图。要用自己的照片，请家人帮忙打开权限。',idle:'要帮忙吗？点一下灯泡。'}},
 en:{title:'🧩 Family Photo Puzzle',newPuzzle:'Make a new puzzle',myPuzzles:'My puzzles',empty:'No puzzles yet. Tap the orange button to make one.',pickPhoto:'Choose a photo',pickTip:'Tap a sample, or use your own photo',album:'From album',camera:'Take photo',badFile:'This photo can’t be opened. Please try another.',cantPick:'❓ Can’t choose a photo?',adjust:'Adjust photo',adjustTip:'Drag with one finger, pinch to zoom',saveImg:'💾 Save image',easy:'Easy',normal:'Normal',hard:'Challenge',more:'Harder:',size:'Text size:',sS:'S',sM:'M',sL:'L',useThis:'Use this photo',howMany:'How many pieces?',start:'Start',done:'Wonderful! All done!',again:'🔁 Play again',home:'🏠 Home',ok:'OK, got it',delQ:'Delete this puzzle?',no:'Keep',yesDel:'Delete',continue:'Continue',replay:'Replay',finished:'Done',pieces:'pieces',
 helpTitle:'Can’t choose a photo?',helpBody:'<p>Try a sample first. To use your own photos, ask family to help:</p><ul><li><b>iPhone / iPad:</b> Settings → Safari → Camera / Photos → Allow</li><li><b>Android:</b> Settings → Apps → Browser → Permissions → Camera &amp; Photos</li></ul><p>Photos stay on this device and are never uploaded.</p>',
 labelDefault:d=>'Made '+d.toLocaleString('en-US',{month:'short'})+' '+d.getFullYear(),prog:(a,b)=>`${a} / ${b} done`,
 v:{hello:'Hello! Let’s make a photo puzzle together.',pick:'Please choose a photo.',adjust:'Drag the photo to choose the part you like. You can also add a few words.',small:'This photo is a little small and may look blurry. You can continue or choose another.',blurry:'This photo looks a little blurry. You can continue or choose another.',bad:'This photo can’t be opened. Please try another.',how:'How many pieces? We picked nine for you.',start:'Drag a piece to where it belongs. It will swap places with the piece there.',resume:'Let’s keep going.',good:['Great!','That’s right!','Well done!','Another flower!'],hint:'Look, the yellow piece goes in the dashed box.',done:'Wonderful! All done! Here are some flowers for you!',saved:'Saved. You can continue next time.',help:'Try a sample first. Ask family to turn on photo access.',idle:'Need help? Tap the light bulb.'}}};
let LANG=localStorage.getItem('pz_lang')||((navigator.language||'zh').startsWith('zh')?'zh':'en');
const t=k=>TXT[LANG][k],V=k=>TXT[LANG].v[k];
function applyLang(){document.documentElement.lang=LANG==='zh'?'zh-CN':'en';document.title=t('title').replace('🧩 ','');
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-th]').forEach(e=>e.innerHTML=t(e.dataset.th));
 $('langBtn').textContent=LANG==='zh'?'🌐 English':'🌐 中文';if(!labelEdited)$('labelTxt').value=t('labelDefault')(new Date());$('labelTxt').placeholder=t('labelDefault')(new Date());
 if($('s-play').classList.contains('on'))upd();if($('s-pieces').classList.contains('on'))buildChoices();renderList()}
// ================= 语音 + 提示音 =================
if(localStorage.getItem('pz_voice_reset')!=='v1.2'){localStorage.setItem('pz_voice','off');localStorage.setItem('pz_voice_reset','v1.2')} // V1.2：语音默认关闭（旧设置重置一次）
let voiceOn=localStorage.getItem('pz_voice')==='on',vT;
function say(s){if(Array.isArray(s))s=s[Math.floor(Math.random()*s.length)];if(!voiceOn){$('voice').classList.add('hide');return}const v=$('voice');v.textContent='🔊 '+s;v.classList.remove('hide');clearTimeout(vT);vT=setTimeout(()=>v.classList.add('hide'),4500);
 if(!voiceOn)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang=LANG==='zh'?'zh-CN':'en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
let AC;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function chime(freqs,d=.18){const a=ac();if(!a)return;freqs.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+i*.09;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.18,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+d+.3);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.35)});try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
// ================= 背景音乐：WebAudio 生成的五声音阶钢琴 + 柔和长音 =================
let musicOn=localStorage.getItem('pz_music')!=='off',music=null;
const PENTA=[0,2,4,7,9],ROOT=261.63;
function nf(st){return ROOT*Math.pow(2,st/12)}
function startMusic(){const a=ac();if(!a||music)return;const out=a.createGain();out.gain.value=0;out.gain.linearRampToValueAtTime(.07,a.currentTime+2);
 const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;lp.connect(out);out.connect(a.destination);
 const dl=a.createDelay();dl.delayTime.value=.42;const fb=a.createGain();fb.gain.value=.3;lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(out);
 const chords=[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]];let step=0,next=a.currentTime+.1;const beat=.6;
 function note(f,t0,dur,vol,type){const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+(type==='sine'?.02:.8));g.gain.exponentialRampToValueAtTime(.0005,t0+dur);o.connect(g).connect(lp);o.start(t0);o.stop(t0+dur+.05)}
 function tick(){while(next<a.currentTime+1.5){const bar=Math.floor(step/8)%4,c=chords[bar];
   if(step%8===0)c.forEach(s=>{note(nf(s-12),next,beat*8.2,.05,'triangle')});
   if(Math.random()<.7){const deg=PENTA[Math.floor(Math.random()*5)]+(Math.random()<.3?12:0);note(nf(deg),next,1.6,.12,'sine');note(nf(deg)*2,next,.8,.02,'sine')}
   step++;next+=beat}}
 tick();music={iv:setInterval(tick,300),out,a}}
function stopMusic(){if(!music)return;const m=music;music=null;m.out.gain.linearRampToValueAtTime(0,m.a.currentTime+.6);setTimeout(()=>{clearInterval(m.iv);m.out.disconnect()},700)}
function setMusicBtns(){['musicBtn','musicBtn2'].forEach(id=>{$(id).textContent=musicOn?'🎵':'🔇';$(id).setAttribute('aria-label',musicOn?'music on':'music off')})}
function toggleMusic(){musicOn=!musicOn;localStorage.setItem('pz_music',musicOn?'on':'off');setMusicBtns();musicOn?startMusic():stopMusic()}

 const fl=['🌸','🌼','🌷','🌺','🌹','💮','🌻'];for(let i=0;i<24;i++){const p=document.createElement('div');p.className='petal';p.textContent=fl[i%fl.length];p.style.left=Math.random()*100+'vw';p.style.fontSize=(24+Math.random()*36)+'px';p.style.animationDuration=(3+Math.random()*3)+'s';p.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(p)}}
onTap($('saveImg'),saveImage);
async function saveImage(){const c=document.createElement('canvas');c.width=c.height=1200;const x=c.getContext('2d');const im=new Image();im.src=CUR.image;await im.decode().catch(()=>{});x.drawImage(im,0,0,1200,1200);
 const blob=await new Promise(r=>c.toBlob(r,'image/png'));const name=(CUR.label||'puzzle').replace(/[\\/:*?"<>|\s]+/g,'_')+'.png';window.__lastSave={size:blob.size,name};
 try{const f=new File([blob],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:t('title')});window.__lastSave.via='share';return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();window.__lastSave.via='download';setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
onTap($('again'),()=>{CUR.pos=null;startPuzzle(false)});onTap($('homeBtn'),()=>{$('celebrate').classList.remove('on');document.querySelectorAll('.petal').forEach(e=>e.remove());go('s-home')});
