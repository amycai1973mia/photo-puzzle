<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;background:#FFF8EC;color:#1E1E1E;font-size:clamp(19px,2.8vmin,28px);user-select:none;-webkit-user-select:none;touch-action:manipulation}

h1{font-size:1.6em;margin:8px 0 4px;text-align:center}h2{font-size:1.2em;margin:0;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{color:#444;margin:4px 0 12px;text-align:center}

.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.wide{width:min(92vw,460px)}
.top{width:100%;display:flex;align-items:center;gap:8px;margin-bottom:6px}

#myList{width:min(94vw,720px);display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:8px}
.card{background:#fff;border:4px solid #1E1E1E;border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.card img{width:100%;aspect-ratio:1;border-radius:10px;cursor:pointer}
.card .meta{font-size:.8em;text-align:center}
.card .del{position:absolute;top:-14px;right:-14px;width:48px;height:48px;border-radius:50%;border:3px solid #1E1E1E;background:#fff;font-size:22px}
.card .badge{position:absolute;top:14px;left:14px;background:#2B8A3E;color:#fff;border-radius:12px;padding:2px 10px;font-size:.75em}
.samples{display:grid;grid-template-columns:repeat(3,min(27vw,180px));gap:14px;margin:6px 0}
.samples canvas{width:100%;aspect-ratio:1;border-radius:18px;border:5px solid #1E1E1E;cursor:pointer}
#cropBox{width:min(92vw,calc(100vh - 360px),calc(100dvh - 360px),520px);aspect-ratio:1;border:5px solid #1E1E1E;border-radius:12px;overflow:hidden;position:relative;background:#333;touch-action:none}
#cropCv{width:100%;height:100%;display:block}
input[type=range]{width:min(70vw,380px);height:52px;accent-color:#E8590C}
input[type=text]{font:inherit;padding:6px 12px;border:4px solid #1E1E1E;border-radius:16px;width:min(88vw,420px);min-height:56px}
#s-crop{padding-bottom:10px}#s-crop .row{margin:4px 0}#s-crop .btn{margin:3px}
.warn{background:#FFF3BF;border:3px solid #E67700;border-radius:16px;padding:8px 16px;margin:6px;display:none;max-width:560px;text-align:center}
.warn.err{background:#FFE3E3;border-color:#C92A2A}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:4000;align-items:center;justify-content:center}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:24px;padding:22px;max-width:min(92vw,620px);max-height:90vh;overflow:auto}
/* 拼图页 */
#s-play{padding:6px 6px 6px;height:100%;min-height:0}
#s-play .top{margin:0 0 6px}
#boardWrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#board{position:relative;background:#ddd;border-radius:6px;box-shadow:0 0 0 3px #1E1E1E;touch-action:none;overflow:visible}
.pc{position:absolute;left:0;top:0;background-repeat:no-repeat;transition:transform .28s ease;touch-action:none;outline:1px solid rgba(255,255,255,.7);outline-offset:-1px}
.pc.drag{transition:none;z-index:50;box-shadow:0 10px 26px rgba(0,0,0,.5);outline:3px solid #fff}
.pc.selp{outline:6px solid #1971C2;outline-offset:-6px;z-index:20}
.pc.ok{outline:none}
.pc.ok::after{content:"✓";position:absolute;right:4%;top:4%;width:max(22px,22%);height:max(22px,22%);border-radius:50%;background:rgba(43,138,62,.88);color:#fff;font-weight:900;font-size:max(14px,calc(var(--cell)*.15));display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.peek{position:absolute;inset:0;z-index:60;background-size:100% 100%;opacity:0;transition:opacity .35s;pointer-events:none;border-radius:6px}
.peek.on{opacity:1;pointer-events:auto}
.ptl{position:absolute;pointer-events:none;z-index:40;font-size:var(--fs);animation:drift 1.4s ease-out forwards}
@keyframes drift{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:0}20%{opacity:.95}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rt)) scale(1);opacity:0}}
#thumb{width:56px;height:56px;border-radius:12px;border:3px solid #1E1E1E;background-size:cover;flex:none;touch-action:none;cursor:zoom-in}
#bigThumb{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:3500;pointer-events:none}
#bigThumb.on{display:flex}
#bigThumb img{width:min(88vw,80vh);border-radius:14px;border:5px solid #fff}
.diff{flex-direction:column;min-width:min(27vw,170px);min-height:96px}
.diff small{font-weight:400;font-size:.7em;opacity:.85}
.more .btn{min-height:56px;font-size:.85em}
.cropCtl{display:flex;flex-direction:column;align-items:center}
@media (orientation:landscape) and (max-height:600px){
 #s-crop.on{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;gap:4px 14px;align-items:start;padding:6px 12px}
 #s-crop .top{grid-column:1/3;margin:0}
 #s-crop #cropBox{width:calc(100vh - 86px);width:calc(100dvh - 86px)}
 #s-crop .cropCtl{justify-content:center;height:100%}
 #s-crop .wide{width:100%}
 #s-play{flex-direction:row;padding:6px;align-items:stretch}
 #s-play .top{flex-direction:column;width:auto;height:100%;margin:0 6px 0 0;justify-content:space-between}
 #s-play .top h2{flex:none;font-size:.8em;white-space:normal;text-align:center;max-width:70px}
 #celebrate{padding-bottom:4px}#endPanel{padding:6px 10px;width:min(96vw,760px)}#endGrid{grid-template-columns:1fr 1fr 1fr 1fr}#endGrid .btn.full{grid-column:1/5}#endGrid .btn{min-height:54px;font-size:.85em}#celebrate h1{font-size:1em}
}
#celebrate{position:fixed;inset:0;display:none;z-index:2000;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18px;pointer-events:none}
#celebrate .row,#celebrate h1,#endPanel{pointer-events:auto}
#endPanel{background:rgba(255,255,255,.96);border:4px solid #1E1E1E;border-radius:22px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.25);width:min(96vw,640px);display:flex;flex-direction:column;align-items:center}
#labList{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}.labRow{display:flex;gap:6px;align-items:center;width:min(94vw,560px)}.labRow input{flex:1;min-width:0;font-size:1em;padding:8px 10px;border:3px solid #1E1E1E;border-radius:14px}.labRow.act input{border-color:#E8590C;box-shadow:0 0 0 3px #FFD8A8}.labRow .ln{font-weight:700;width:1.4em;text-align:center}.labRow .lx{min-width:48px;min-height:48px;padding:0}
#timeLine{font-size:1em;font-weight:700;text-align:center;margin:2px 0}#bestLine{font-size:.85em;text-align:center;color:#2B8A3E;margin:0 0 4px}
#endGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}#endGrid .btn{margin:0;min-height:64px;font-size:.95em}
#endGrid .btn.full{grid-column:1/3}
.setRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.tog{min-height:56px;font-size:.85em}.tog.off{opacity:.6;border-style:dashed}
#homeDiff{display:flex;flex-direction:column;align-items:center}
#bouquetWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity 1s}
#bouquetWrap.fade{opacity:0}
#celebrate.on{display:flex}
#bouquet{font-size:min(30vw,30vh);animation:grow 1.2s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
@keyframes grow{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1)}}
.petal{position:fixed;top:-10vh;pointer-events:none;z-index:1999;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}
#celebrate h1{font-size:1.1em;margin:0 0 2px;border:none;box-shadow:none;padding:0;background:#fff;border-radius:20px;padding:6px 22px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){.flower,#bouquet,.petal,.pc.hintp{animation-duration:.01s}}
#voice{pointer-events:none;position:fixed;bottom:8px;left:12px;right:12px;margin:auto;width:fit-content;max-width:92%;background:#1E1E1E;color:#fff;padding:9px 20px;border-radius:40px;z-index:5000;font-size:.9em;text-align:center;transition:opacity .5s}
#voice.hide{opacity:0}
body.ending #boardWrap{align-items:flex-start}
#endGrid .btn{min-height:58px}
@media (orientation:landscape){#celebrate{align-items:flex-end;justify-content:center;padding:0 10px}#endPanel{width:min(44vw,460px)}body.ending #boardWrap{justify-content:flex-start;align-items:center}}
@media (orientation:landscape) and (max-height:600px){#endPanel{padding:6px 8px}#endGrid .btn{min-height:52px;font-size:.8em}#celebrate h1{font-size:.95em}#timeLine{font-size:.85em}#bestLine{font-size:.75em}}
/* ===== V1.4 首次教程 ===== */
#tut{position:fixed;inset:0;z-index:4500;background:rgba(30,30,30,.6);display:none;align-items:center;justify-content:center;padding:12px}
#tut.on{display:flex}
#tutCard{background:#FFF8EC;border:5px solid #1E1E1E;border-radius:28px;width:min(94vw,640px);max-height:96vh;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;align-items:center;gap:8px}
#tutCard h2{white-space:normal;font-size:1.35em;flex:none}
.prefs .btn{white-space:nowrap}
.tcol{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
#tutCard p{margin:0;text-align:center;line-height:1.45}
.tstep{font-weight:700;color:#E8590C}
.tdots{display:flex;gap:10px}.tdots i{width:14px;height:14px;border-radius:50%;background:#CED4DA}.tdots i.on{background:#E8590C}
.tbtns{display:flex;gap:12px;width:100%;justify-content:space-between}.tbtns .btn{flex:1;margin:0}
.stage{position:relative;width:min(70vw,38vh,280px);height:min(70vw,38vh,280px);flex:none}
.scene{position:absolute;inset:0;display:none}.scene.on{display:block}
.finger{position:absolute;font-size:44px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));z-index:5;pointer-events:none}
/* 场景1 */
.s1row{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
.s1opt{height:28%;border:4px solid #1E1E1E;border-radius:18px;background:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;font-weight:700;font-size:.95em}
.s1opt b{font-size:1.6em}
.s1opt.a{animation:pick 4.5s infinite}.s1opt.b{animation:pick 4.5s 1.5s infinite}.s1opt.c{animation:pick 4.5s 3s infinite}
@keyframes pick{0%,8%{background:#fff}12%,30%{background:#FFE8CC;border-color:#E8590C;transform:scale(1.04)}34%,100%{background:#fff;transform:none}}
.f1{right:6%;animation:f1 4.5s infinite}
@keyframes f1{0%,30%{top:10%}33%,63%{top:42%}66%,100%{top:74%}}
/* 场景2 */
.frame{position:absolute;inset:6%;border:5px solid #1E1E1E;border-radius:12px;overflow:hidden;background:#74C0FC}
.photo2{position:absolute;inset:-20%;background:linear-gradient(#74C0FC 55%,#51CF66 55%);animation:pan 6s infinite}
.photo2:before{content:"🏠";position:absolute;left:38%;top:30%;font-size:70px}.photo2:after{content:"☀️";position:absolute;left:66%;top:12%;font-size:40px}
@keyframes pan{0%,10%{transform:translate(0,0) scale(1)}35%{transform:translate(-12%,-6%) scale(1)}50%{transform:translate(-12%,-6%) scale(1)}75%,100%{transform:translate(-4%,-2%) scale(1.3)}}
.label2{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);background:rgba(255,255,255,.88);border-radius:20px;padding:3px 12px;font-weight:700;white-space:nowrap;font-size:.85em;animation:lab 6s infinite}
@keyframes lab{0%,75%{opacity:0}85%,100%{opacity:1}}
.f2a{animation:f2a 6s infinite}.f2b{animation:f2b 6s infinite}
@keyframes f2a{0%{left:45%;top:45%;opacity:1}35%{left:30%;top:35%;opacity:1}45%{opacity:0;left:30%;top:35%}50%{left:40%;top:45%;opacity:1}75%{left:22%;top:30%;opacity:1}80%,100%{opacity:0}}
@keyframes f2b{0%,48%{opacity:0;left:50%;top:50%}50%{left:50%;top:50%;opacity:1}75%{left:66%;top:62%;opacity:1}80%,100%{opacity:0}}
/* 场景3 */
.g3{position:absolute;inset:6%;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#1E1E1E;border:4px solid #1E1E1E;border-radius:10px}

.g3 .ok3:after{content:"✓";position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;background:#2B8A3E;color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}
.mv{position:absolute;width:29%;height:29%;font-size:30px;display:flex;align-items:center;justify-content:center;background:#FFD8A8;border:3px solid #fff;z-index:3;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.mvA{animation:mvA 5s infinite}.mvB{animation:mvB 5s infinite;box-shadow:none}
@keyframes mvA{0%,10%{left:7.5%;top:68%}45%,100%{left:63.5%;top:7.5%}}
@keyframes mvB{0%,40%{left:63.5%;top:7.5%;opacity:1}45%{opacity:1}55%,100%{left:7.5%;top:68%;opacity:1}}
.chk3{position:absolute;right:9%;top:9%;width:30px;height:30px;border-radius:50%;background:#2B8A3E;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:4;animation:chk 5s infinite}
@keyframes chk{0%,50%{transform:scale(0)}58%{transform:scale(1.3)}65%,100%{transform:scale(1)}}
.f3{animation:f3 5s infinite}
@keyframes f3{0%,10%{left:18%;top:76%;opacity:1}45%{left:74%;top:16%;opacity:1}50%,100%{opacity:0;left:74%;top:16%}}
.aids{display:flex;gap:16px;justify-content:center;font-size:.85em}.aids span{border:3px solid #1E1E1E;border-radius:14px;padding:4px 10px;background:#fff}
@media (orientation:landscape) and (max-height:600px){#tutCard{flex-direction:row;flex-wrap:wrap;justify-content:center;width:min(96vw,820px);padding:10px 14px;gap:6px 16px}
 .stage{width:calc(100vh - 120px);height:calc(100vh - 120px)}.tcol{flex:1;min-width:300px;display:flex;flex-direction:column;align-items:center;gap:8px}}

function buildQ(){$('qBtn').textContent=gridTxt(S.n)+' ▾';const q=$('qDiff');q.innerHTML='';LV.forEach(n=>{const b=document.createElement('button');b.className='btn'+(n===S.n?' sel':'');b.dataset.qn=n;b.innerHTML=`<span>${levelName(n)} ${gridTxt(n)}</span><small>${n} ${t('pcs')}</small>`;onTap(b,()=>{closeQ();askQ(n)});q.appendChild(b)})}
function openQ(){const q=$('qDiff'),r=$('qBtn').getBoundingClientRect();q.classList.add('on');$('qShade').classList.add('on');const qw=q.offsetWidth,qh=q.offsetHeight;
 let x=innerWidth>innerHeight?r.right+6:Math.min(innerWidth-qw-6,Math.max(6,r.left+r.width/2-qw/2)),y=innerWidth>innerHeight?Math.max(6,Math.min(innerHeight-qh-6,r.top-qh/2)):r.bottom+6;q.style.left=x+'px';q.style.top=y+'px'}
function closeQ(){$('qDiff').classList.remove('on');$('qShade').classList.remove('on')}
onTap($('qBtn'),()=>{$('qDiff').classList.contains('on')?closeQ():openQ()});onTap($('qShade'),closeQ);
let qTarget=0;function inProgress(){return !lock&&CUR&&((CUR.swaps||0)>0||(CUR.swaps==null&&(CUR.playMs||0)>3000))}
function askQ(n){if(n===S.n)return;if(inProgress()){qTarget=n;$('qQ').textContent=t('qQ')(n);$('qBox').classList.add('on')}else switchQ(n)}
function switchQ(n){tStop();$('qBox').classList.remove('on');S.n=n;Object.assign(CUR,{n,pos:null,correct:0,playMs:0,swaps:0});startPuzzle(false)}
onTap($('qYes'),()=>switchQ(qTarget));onTap($('qNo'),()=>$('qBox').classList.remove('on'));
function persist(){if(!CUR)return;if(runFrom){tStop();tStart()}CUR.pos=pos.slice();CUR.correct=pos.filter((v,i)=>v===i).length;CUR.n=S.n;CUR.updatedAt=Date.now();dbPut(CUR);try{window.pzCloud&&pzCloud.onSave(CUR)}catch(e){}}
function idle(){} // V1.2：去掉 40 秒语音提醒
function swap(c1,c2){if(c1===c2||pos[c1]===c1||pos[c2]===c2)return;const a=pos[c1],b=pos[c2];pos[c1]=b;pos[c2]=a;CUR.swaps=(CUR.swaps||0)+1;place(a);place(b);clearHint();
 const newly=[c1,c2].filter(c=>pos[c]===c);newly.forEach(c=>{els[c].classList.add('ok');petals(c)});
 const total=upd();persist();idle();
 if(total===pos.length){lock=true;setTimeout(celebrate,450)}else if(newly.length){chime([784,1047])}else chime([392],.08)}
function petals(c){const n=S.n;for(let i=0;i<5;i++){const f=document.createElement('div');f.className='ptl';f.textContent=['🌸','💮','🌸','🏵️','🌸'][i];f.style.setProperty('--fs',Math.max(12,cell*.14)+'px');
 f.style.left=((c%COLS)+.3+Math.random()*.4)*CW+'px';f.style.top=(Math.floor(c/COLS)+.3+Math.random()*.3)*CH+'px';f.style.setProperty('--dx',(Math.random()-.5)*cell*.8+'px');f.style.setProperty('--dy',cell*(.3+Math.random()*.4)+'px');f.style.setProperty('--rt',(Math.random()*240-120)+'deg');f.style.animationDelay=i*60+'ms';$('board').appendChild(f);setTimeout(()=>f.remove(),1600)}}
// 拖动 / 点选（全部用 pointer 事件）
let dg=null;
$('board').addEventListener('pointerdown',e=>{if(lock)return;const d=e.target.closest('.pc');if(!d)return;const k=+d.dataset.k,c=cellOf(k);if(pos[c]===c){chime([330],.06);return}
 e.preventDefault();d.setPointerCapture(e.pointerId);const r=$('board').getBoundingClientRect();dg={k,c,id:e.pointerId,sx:e.clientX,sy:e.clientY,r,moved:false,d}});
$('board').addEventListener('pointermove',e=>{if(!dg||e.pointerId!==dg.id)return;const dx=e.clientX-dg.sx,dy=e.clientY-dg.sy;if(!dg.moved&&Math.hypot(dx,dy)<12)return;
 if(!dg.moved){dg.moved=true;dg.d.classList.add('drag');clearSel()}dg.d.style.transform=`translate(${(dg.c%COLS)*CW+dx}px,${Math.floor(dg.c/COLS)*CH+dy}px) scale(1.06)`});
function endDrag(e){if(!dg||e.pointerId!==dg.id)return;const g=dg;dg=null;g.d.classList.remove('drag');const n=S.n;
 if(!g.moved){ // 点选
  if(sel<0){hidePeek();sel=g.c;g.d.classList.add('selp');chime([523],.06)}else if(sel===g.c){clearSel()}else{const s=sel;clearSel();swap(s,g.c)}return}
 const x=e.clientX-g.r.left,y=e.clientY-g.r.top,tc=Math.floor(y/CH)*COLS+Math.floor(x/CW),inB=x>=0&&y>=0&&x<CW*COLS&&y<CH*ROWS;
 if(inB&&tc!==g.c&&pos[tc]!==tc)swap(g.c,tc);else{place(g.k);if(inB&&pos[tc]===tc)chime([330],.06)}}
$('board').addEventListener('pointerup',endDrag);$('board').addEventListener('pointercancel',endDrag);
function clearSel(){if(sel>=0){els[pos[sel]].classList.remove('selp')}sel=-1}
let peekT;function hidePeek(){clearTimeout(peekT);const p=$('peek');if(p)p.classList.remove('on')}function clearHint(){hidePeek()}
onTap($('hintBtn'),()=>{if(lock)return;const p=$('peek');if(!p)return;clearSel();p.classList.add('on');clearTimeout(peekT);peekT=setTimeout(hidePeek,2500)});
// 右上角原图缩略图：按住放大，松开隐藏
(()=>{const th=$('thumb'),big=$('bigThumb');const on=e=>{e.preventDefault();th.setPointerCapture&&th.setPointerCapture(e.pointerId);big.classList.add('on')},off=()=>big.classList.remove('on');
 th.addEventListener('pointerdown',on);th.addEventListener('pointerup',off);th.addEventListener('pointercancel',off);th.addEventListener('lostpointercapture',off);th.addEventListener('contextmenu',e=>e.preventDefault())})();
onTap($('playBack'),()=>{tStop();persist();go(backTo)});
function celebrate(){document.body.classList.add('ending');requestAnimationFrame(layout);tStop();persist();els.forEach(e=>e.classList.remove('ok'));
 const ms=CUR.playMs||0,n=S.n;CUR.done=CUR.done||{};CUR.bestMs=CUR.bestMs||{};CUR.done[n]=true;if(!CUR.bestMs[n]||ms<CUR.bestMs[n])CUR.bestMs[n]=Math.round(ms);persist();const key='pz_best_g'+n,prev=+localStorage.getItem(key)||0,isBest=!prev||ms<prev;if(isBest){localStorage.setItem(key,Math.round(ms));try{window.pzCloud&&pzCloud.onBest(n,ms)}catch(e){}}
 $('timeLine').textContent=t('timeUsed')(...fmt(ms));$('bestLine').textContent=isBest&&prev?t('newBest'):t('best')(...fmt(isBest?ms:prev));if(isBest&&prev)chime([659,784,988,1319],.3);
 const nb=$('nextLvl'),nx=LV[LV.indexOf(n)+1];nb.style.display='';nb.textContent=nx?t('next')(levelName(nx)+' '+gridTxt(nx),nx):t('again'); // V1.12：没有下一关就是「再玩一次」，不再留空
 window.__last={ms,best:isBest,prev};try{window.dispatchEvent(new CustomEvent('pz-done',{detail:{n,ms:Math.round(ms),grid:gridTxt(n)}}))}catch(e){}$('celebrate').classList.add('on');$('bouquetWrap').classList.remove('fade');setTimeout(()=>$('bouquetWrap').classList.add('fade'),2600);chime([523,659,784,1047],.4);
 const fl=['🌸','🌼','🌷','🌺','🌹','💮','🌻'];for(let i=0;i<24;i++){const p=document.createElement('div');p.className='petal';p.textContent=fl[i%fl.length];p.style.left=Math.random()*100+'vw';p.style.fontSize=(24+Math.random()*36)+'px';p.style.animationDuration=(3+Math.random()*3)+'s';p.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(p)}}
onTap($('saveImg'),()=>CUR&&window.PZsharePuzzle?window.PZsharePuzzle(CUR):alert(t('title')));
// V1.13：朋友打开 ?share= 链接 → 只放这一张拼图（存在朋友本机，7天后不能再玩）
window.pzOpenShared=async(d,token)=>{const id='sh_'+token;let p=(await dbAll()).find(x=>x.id===id);const im=await loadImg(d.img);const aspect=im?im.naturalWidth/im.naturalHeight:.75;
 if(!p){const th=document.createElement('canvas');if(im){th.width=im.naturalWidth;th.height=im.naturalHeight;th.getContext('2d').drawImage(im,0,0)}const now=Date.now();p={id,photoKey:'share_'+token,srcKey:null,schemaVersion:5,aspect,createdAt:now,updatedAt:now,label:d.labels||'',image:d.img,thumb:im?mkThumb(th).toDataURL('image/jpeg',.8):d.img,n:GRID[d.grid]?d.grid:12,pos:null,correct:0,playMs:0,swaps:0,done:{},bestMs:{},sharedExp:d.expiresAt};await dbPut(p)}
 sessionStorage.setItem('pz_entered','1');backTo='s-home';openPuzzle(p,false)};
window.pzCur=()=>CUR;
async function saveImage(){const c=document.createElement('canvas');const x=c.getContext('2d');const im=new Image();im.src=CUR.image;await im.decode().catch(()=>{});const k=1200/Math.max(im.naturalWidth||1,im.naturalHeight||1);c.width=Math.round((im.naturalWidth||1)*k);c.height=Math.round((im.naturalHeight||1)*k);x.drawImage(im,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,'image/png'));const name=(CUR.label||'puzzle').replace(/[\\/:*?"<>|\s]+/g,'_')+'.png';window.__lastSave={size:blob.size,name};
 try{const f=new File([blob],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:t('title')});window.__lastSave.via='share';return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();window.__lastSave.via='download';setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
onTap($('nextLvl'),()=>{const n=LV[LV.indexOf(S.n)+1];if(!n){CUR.pos=null;CUR.playMs=0;CUR.swaps=0;startPuzzle(false);return}setHomeN(n);S.n=n;Object.assign(CUR,{n,pos:null,correct:0,playMs:0,swaps:0});startPuzzle(false)});

// ===== V1.5 隐藏时暂停音乐 + 退出 =====
function pauseAudio(){try{speechSynthesis.cancel()}catch(e){}if(AC&&AC.state==='running')AC.suspend()}
function resumeAudio(){if(exited||document.hidden)return;if(musicOn&&AC){AC.resume();if(!music)startMusic()}}

addEventListener('pagehide',pauseAudio);addEventListener('blur',pauseAudio);addEventListener('focus',resumeAudio);addEventListener('pageshow',resumeAudio);
onTap($('exitBtn'),()=>{try{if(CUR&&$('s-play').classList.contains('on'))persist()}catch(e){}exited=true;pauseAudio();if(music){const m=music;music=null;clearInterval(m.iv);try{m.out.disconnect()}catch(e){}}
 go('s-bye');try{window.close()}catch(e){}});
